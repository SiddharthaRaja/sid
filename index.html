<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>Sid</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sid">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-mark">SID</div>
  <div class="boot-msg" id="boot-msg">starting…</div>
</div>

<!-- ============ AUTH GATE ============ -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-mark">SID</div>
    <p class="gate-sub">Release &amp; content management</p>
    <button id="btn-google" class="btn btn-primary btn-lg">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.8-.4-4H24v7.3h12.1c-.2 2-1.6 5-4.5 7l-.1.3 6.5 5 .5.1c4.2-3.9 6.6-9.6 6.6-15.7"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.4c-1.8 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.1l-.3
 0-6.7 5.2-.1.2C8 41.1 15.4 46 24 46"/><path fill="#FBBC05" d="M11.5 28.4c-.5-1.4-.8-2.9-.8-4.4s.3-3 .7-4.4v-.3l-6.8-5.3-.2.1A22 22 0 0 0 2 24c0 3.5.9 6.9 2.4 9.9z"/><path fill="#EA4335" d="M24 9.5c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 3.4 29.9 1 24 1 15.4 1 8 5.9 4.4 13.1l7.1 5.5C13.3 13.3 18.2 9.5 24 9.5"/></svg>
      Continue with Google
    </button>
    <p class="gate-note">Everything you type is saved to your Google account continuously — mid-sentence, not just at the end.</p>
    <p id="gate-err" class="gate-err" hidden></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>

  <aside class="nav" id="nav">
    <div class="nav-head">
      <div class="nav-mark">SID</div>
      <button class="icon-btn nav-close" id="nav-close" aria-label="Close menu">&times;</button>
    </div>
    <div class="nav-scroll" id="nav-scroll"><!-- built by js --></div>
    <div class="nav-foot">
      <button class="nav-user" id="nav-user">
        <img id="user-pic" alt="" width="26" height="26">
        <span id="user-name">—</span>
      </button>
      <button class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path class="ico-moon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/><g class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></g></svg>
      </button>
    </div>
  </aside>

  <div class="nav-backdrop" id="nav-backdrop"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn only-mobile" id="nav-open" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="top-title" id="top-title">Dashboard</div>
      <div class="top-right">
        <span class="sync" id="sync"><span class="sync-dot"></span><span id="sync-text">saved</span></span>
        <button class="icon-btn" id="btn-search" title="Search (⌘K)" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <nav class="tabbar" id="tabbar"><!-- built by js --></nav>
</div>

<!-- ============ AUDIOBOOK PLAYER ============ -->
  <div class="player" id="player" hidden>
    <button class="pl-play" id="pl-play" aria-label="Play or pause">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path class="pl-ico-play" d="M8 5.2v13.6l11-6.8z"/>
        <g class="pl-ico-pause" hidden><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></g>
      </svg>
    </button>
    <div class="pl-mid">
      <div class="pl-title" id="pl-title">—</div>
      <div class="pl-line" id="pl-line"></div>
      <div class="pl-bar"><i id="pl-fill"></i></div>
    </div>
    <div class="pl-controls">
      <button class="icon-btn" id="pl-prev" title="Back a passage" aria-label="Back">‹‹</button>
      <button class="icon-btn" id="pl-next" title="Forward a passage" aria-label="Forward">››</button>
      <button class="icon-btn" id="pl-cfg" title="Speed and voice" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M21 12h-2M5 12H3M18.4 5.6l-1.4 1.4M7 17l-1.4 1.4M18.4 18.4L17 17M7 7L5.6 5.6"/></svg>
      </button>
      <button class="icon-btn" id="pl-close" title="Stop" aria-label="Stop">&times;</button>
    </div>
  </div>

  <div class="modal-root" id="modal-root" hidden></div>
<div class="toast-root" id="toast-root"></div>

<script type="module" src="./js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
